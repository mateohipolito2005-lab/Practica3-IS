# Ejemplo para Render: requiere disco persistente (plan compatible; puede ser de pago).
services:
  - type: web
    name: unitask-demo
    runtime: docker
    plan: starter
    healthCheckPath: /health
    disk:
      name: unitask-sqlite
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /app/data/unitask.sqlite
      - key: PUBLIC_ORIGIN
        sync: false
